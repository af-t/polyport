[package]
name = "polyport-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"

[dependencies]
base64 = "0.22"
ignore = "0.4"
regex = "1.13.1"
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }

[dev-dependencies]
axum = { version = "0.8" }
tempfile = "3"

[lints]
workspace = true
