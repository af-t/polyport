[package]
name = "polyport"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"

[[bin]]
name = "polyport"
path = "src/main.rs"

[dependencies]
polyport-core = { version = "0.1.0", path = "../core" }
polyport-agent = { path = "../agent", optional = true }
polyport-webui = { path = "../webui", optional = true }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
axum = { version = "0.8" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[features]
default = ["webui", "agent"]
webui = ["dep:polyport-webui"]
agent = ["dep:polyport-agent"]

[lints]
workspace = true
