[package]
name = "polyport"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"

[[bin]]
name = "polyport"
path = "src/main.rs"

[dependencies]
polyport-core = { version = "0.1.0", path = "../core" }
rust-embed = "8.13"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.6", features = ["derive"] }

[lints]
workspace = true
